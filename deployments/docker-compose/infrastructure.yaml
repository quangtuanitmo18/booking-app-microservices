# Infrastructure-only compose file
# Use this to run infrastructure without application services:
#   docker compose -f infrastructure.yaml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  #######################################################
  #  Rabbitmq
  #######################################################
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - booking
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


    #######################################################
    #  Postgres
    #######################################################
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking


    #######################################################
    #  Prometheus
    #######################################################
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 9090:9090
    volumes:
      - ./../configs/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
      - "--log.level=info"
    networks:
      - booking


    #######################################################
    #  Tempo
    #######################################################
  tempo:
    image: grafana/tempo:2.1.0
    container_name: tempo
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./../configs/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    expose:
      - 3200
      - 9095
      - 4317
      - 4318
    networks:
      - booking


    #######################################################
    #  Loki
    #######################################################
  loki:
    image: grafana/loki:2.9.4
    hostname: loki
    container_name: loki
    restart: unless-stopped
    logging: *default-logging
    expose:
      - 3100
      - 9096
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./../configs/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - booking


    #######################################################
    #  Grafana
    #######################################################
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./../configs/grafana/provisioning:/etc/grafana/provisioning
      - ./../configs/grafana/dashboards:/var/lib/grafana/dashboards
      - ./../configs/grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - booking


    #######################################################
    #  OtelCollector
    #######################################################
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: otel-collector
    restart: unless-stopped
    logging: *default-logging
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./../configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "11888:1888"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
      - "4317:4317"
      - "4318:4318"
      - "55679:55679"
    networks:
      - booking

networks:
  booking:

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

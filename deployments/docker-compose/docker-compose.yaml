

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  #######################################################
  #  Rabbitmq
  #######################################################
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - booking
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


    #######################################################
    #  Postgres
    #######################################################
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking


    #######################################################
    #  Prometheus
    #######################################################
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 9090:9090
    volumes:
      - ./../configs/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # need this for the OpenTelemetry collector to be able to put metrics into Prometheus
      - "--web.enable-remote-write-receiver"
      - "--log.level=info"
    networks:
      - booking


    #######################################################
    #  Tempo
    #######################################################
  tempo:
    image: grafana/tempo:2.1.0
    container_name: tempo
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./../configs/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    expose:
      - 3200 # HTTP port
      - 9095 # gRPC port
      - 4317 # otlp grpc
      - 4318 # otlp http
    networks:
      - booking


    #######################################################
    #  Loki
    #######################################################
  loki:
    image: grafana/loki:2.9.4
    hostname: loki
    container_name: loki
    restart: unless-stopped
    logging: *default-logging
    expose:
      - 3100 # HTTP port
      - 9096 # gRPC port
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./../configs/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - booking


    #######################################################
    #  Grafana
    #######################################################
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./../configs/grafana/provisioning:/etc/grafana/provisioning
      - ./../configs/grafana/dashboards:/var/lib/grafana/dashboards
      - ./../configs/grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - booking


    #######################################################
    #  OtelCollector
    #######################################################
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: otel-collector
    restart: unless-stopped
    logging: *default-logging
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./../configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "11888:1888" # pprof extension
      - "8888:8888" # Prometheus metrics exposed by the Collector
      - "8889:8889" # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
      - "55679:55679" # zpages extension
    networks:
      - booking


    #######################################################
    #  Identity
    #######################################################
  identity:
    build:
      context: ../..
      dockerfile: src/identity/Dockerfile
    container_name: identity
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../../src/identity/.env.docker
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking


    #######################################################
    #  Flight
    #######################################################
  flight:
    build:
      context: ../..
      dockerfile: src/flight/Dockerfile
    container_name: flight
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../../src/flight/.env.docker
    ports:
      - "3344:3344"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3344/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking


    #######################################################
    #  Passenger
    #######################################################
  passenger:
    build:
      context: ../..
      dockerfile: src/passenger/Dockerfile
    container_name: passenger
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../../src/passenger/.env.docker
    ports:
      - "3355:3355"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3355/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking


    #######################################################
    #  Booking
    #######################################################
  booking:
    build:
      context: ../..
      dockerfile: src/booking/Dockerfile
    container_name: booking
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../../src/booking/.env.docker
    ports:
      - "3366:3366"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3366/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking
    #######################################################
    #  API Gateway (BFF)
    #######################################################
  api-gateway:
    build:
      context: ../..
      dockerfile: src/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      identity:
        condition: service_healthy
      flight:
        condition: service_healthy
      passenger:
        condition: service_healthy
      booking:
        condition: service_healthy
    env_file:
      - ../../src/api-gateway/.env.docker
    ports:
      - "3377:3377"
    networks:
      - booking


    #######################################################
    #  Frontend (Next.js)
    #######################################################
  frontend:
    build:
      context: ../..
      dockerfile: src/frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api-gateway
    env_file:
      - ../../src/frontend/.env.docker
    ports:
      - "3001:3001"
    networks:
      - booking


networks:
  booking:

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
